<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .father{
        display: flex;

        /* 修改主轴方向到垂直方向，侧轴自动变为水平 */
        flex-direction: column;

        /* 主轴方向居中，垂直居中 */
        justify-content: center;

        /* 侧轴方向居中，水平居中 */
        align-items: center;

        width: 400px;
        height: 400px;
        background-color: pink;
    }
</style>
<body>
    <div class="father">
        <img src="./ys_wanan.png" alt="刻晴晚安">
        <span>刻晴晚安</span>
    </div>
</body>
</html>
